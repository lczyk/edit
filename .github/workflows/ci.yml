name: CI

on:
  push:
    branches:
      - lczyk-remix
  pull_request:
    branches:
      - lczyk-remix

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      # https://github.com/actions/cache/blob/main/examples.md#rust---cargo
      # Depends on `Cargo.lock` --> Has to be after checkout.
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      # Stable is enough: the only `feature(...)` gate is behind
      # `target_arch = "loongarch64"`, which this fork does not target.
      - name: Install Rust
        run: rustup toolchain install stable --no-self-update --profile minimal --component rustfmt,clippy
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run tests
        run: cargo test --all-features --all-targets
      - name: Run clippy
        run: cargo clippy --all-features --all-targets -- --no-deps --deny warnings

  pty:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-pty-${{ hashFiles('**/Cargo.lock') }}
      - name: Install Rust
        run: rustup toolchain install stable --no-self-update --profile minimal
      # The suite drives target/release/edit through a pseudo-terminal.
      - name: Build
        run: cargo build --release
      # Timings are plain sleeps; a loaded runner needs a slower pace.
      - name: Run PTY tests
        run: python3 tests/pty/framework.py --pace 2

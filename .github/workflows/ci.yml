name: CI

on:
  push:
    branches:
      - lczyk-remix
  pull_request:
    branches:
      - lczyk-remix

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      # https://github.com/actions/cache/blob/main/examples.md#rust---cargo
      # Depends on `Cargo.lock` --> Has to be after checkout.
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      # Stable is enough: the only `feature(...)` gate is behind
      # `target_arch = "loongarch64"`, which this fork does not target.
      - name: Install Rust
        run: rustup toolchain install stable --no-self-update --profile minimal --component rustfmt,clippy
      - name: Check formatting
        run: cargo fmt --all -- --check
      # Not --all-features: stdext's `single-threaded` feature swaps the scratch
      # arenas for a `static mut` pair, which the threaded test harness aborts
      # on. See the FEATURES comment in the Makefile.
      - name: Run tests
        run: cargo test --workspace --all-targets --features edit/sanity,lsh/sanity,lsh-defs/sanity,gutter/sanity,stdext/sanity
      - name: Run clippy
        run: cargo clippy --workspace --all-targets --features edit/sanity,lsh/sanity,lsh-defs/sanity,gutter/sanity,stdext/sanity -- --no-deps --deny warnings

  pty:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-pty-${{ hashFiles('**/Cargo.lock') }}
      - name: Install Rust
        run: rustup toolchain install stable --no-self-update --profile minimal
      # The suite drives target/release/edit through a pseudo-terminal.
      - name: Build
        run: cargo build --release
      # Timings are plain sleeps; a loaded runner needs a slower pace.
      - name: Run PTY tests
        run: python3 tests/pty/framework.py --pace 2
      # Again against a sanity build, where --strict-sanity turns a tripped
      # invariant into a failed test. Separate run: the checks cost enough that
      # the plain pass above is what should report a timing regression.
      - name: Build with sanity checks
        run: cargo build --features sanity
      - name: Run PTY tests with the invariant checks armed
        run: EDIT_BIN=target/debug/edit python3 tests/pty/framework.py --pace 2 --strict-sanity

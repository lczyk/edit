# Edit keybindings.
#
# One chord per action. Modifiers: Ctrl, Alt, Shift, Cmd (Super).
# Separate modifiers and the key with "+". Key names: letter A-Z, digit 0-9,
# Up/Down/Left/Right, Home/End/PageUp/PageDown, Insert/Delete,
# Tab/Back/Return/Escape/Space, F1..F24, Numpad0..Numpad9.
#
# Set a value to "" to leave an action unbound.

[keybindings]
new_file         = "Ctrl+N"
open_file        = "Ctrl+O"
save             = "Ctrl+S"
save_as          = ""
open_preferences = ""
close_file       = "Ctrl+W"
exit             = "Ctrl+Q"

undo             = "Ctrl+Z"
redo             = "Ctrl+Y"
cut              = "Ctrl+X"
copy             = "Ctrl+C"
paste            = "Ctrl+V"
select_all       = "Ctrl+A"
find             = "Ctrl+F"
replace          = "Ctrl+R"

focus_statusbar  = ""
go_to_file       = "Ctrl+P"
go_to_line       = "Ctrl+G"
toggle_word_wrap = "Alt+Z"

open_about       = ""
focus_menubar    = "F10"

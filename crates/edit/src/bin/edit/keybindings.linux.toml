# Edit keybindings (Linux).
#
# One chord per action. Modifiers: Ctrl, Alt, Shift, Cmd (Super).
# Separate modifiers and the key with "+". Key names: letter A-Z, digit 0-9,
# Up/Down/Left/Right, Home/End/PageUp/PageDown, Insert/Delete,
# Tab/Back/Return/Escape/Space, F1..F24, Numpad0..Numpad9.
#
# Set a value to "" to leave an action unbound.

[keybindings]
exit             = "Ctrl+Q"

undo             = "Ctrl+Z"
redo             = "Ctrl+Y"
cut              = "Ctrl+X"
copy             = "Ctrl+C"
paste            = "Ctrl+V"
select_all       = "Ctrl+A"
find             = "Ctrl+F"
replace          = "Ctrl+R"

focus_statusbar  = ""
go_to_line       = "Ctrl+G"
toggle_word_wrap = "Alt+Z"

open_about       = ""
focus_menubar    = "F10"

move_line_up     = "Alt+Up"
move_line_down   = "Alt+Down"

delete_line      = "Ctrl+Shift+K"

toggle_line_comment = "Ctrl+/"

# Cursor jumps 3 lines at a time. Select variants extend the selection.
# Default chords avoid Shift so the select variant is a natural Shift+chord.
small_jump_up           = "Ctrl+Alt+Up"
small_jump_down         = "Ctrl+Alt+Down"
small_jump_up_select    = "Ctrl+Alt+Shift+Up"
small_jump_down_select  = "Ctrl+Alt+Shift+Down"

# Smart line-start: jumps to end of indent, or column 0 if already at/before indent.
# Unbound on Linux by default; Home/End already do the job via the textarea.
line_start              = ""
line_end                = ""
line_start_select       = ""
line_end_select         = ""

# Delete from cursor to start/end of the current logical line.
# Unbound on Linux by default (vscode does the same); bind here if wanted.
delete_to_line_start    = ""
delete_to_line_end      = ""
